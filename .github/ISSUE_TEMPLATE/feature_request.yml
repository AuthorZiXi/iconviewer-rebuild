name: Feature request
description: Suggest an improvement for IconViewer Rebuild
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please describe the *problem* first — the solution
        is often easier to agree on that way.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Icon / device image decoding
        - UI and lists
        - Copy / drag & drop / export
        - Options and settings
        - Localisation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: What are you trying to do that the app makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
