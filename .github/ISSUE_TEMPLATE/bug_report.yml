name: Bug report
description: Something in IconViewer Rebuild does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please attach a screenshot of the window when you can —
        it makes icon/preview problems much easier to diagnose.

        Do **not** attach proprietary files you are not allowed to share; if a specific
        DLL/ICO triggers the problem, describe how to get it instead.

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example "Windows 11 24H2 (26100)" or "Windows 10 22H2"
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build are you running?
      options:
        - Downloaded IconViewerRebuild.exe from Releases
        - Built it myself (build.bat / CMake)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the actual behaviour. Include the file you opened and the icon ID when relevant.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. Open ...
        2. Select icon ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate
          required: true
        - label: I am running the latest release
          required: false
