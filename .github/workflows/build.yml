name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B out -A x64

      - name: Build
        run: cmake --build out --config Release

      - name: Smoke test the loaders
        run: |
          out\Release\test_load.exe C:\Windows\System32\imageres.dll

      - uses: actions/upload-artifact@v4
        with:
          name: IconViewerRebuild-x64
          path: out/Release/IconViewerRebuild.exe
